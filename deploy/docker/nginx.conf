server {
	listen 80;
	server_name _;
	server_tokens off;
	# Relative redirects (/en → /en/): behind the tunnel nginx only sees http on port 80.
	absolute_redirect off;

	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
	gzip_min_length 512;

	# Docker healthcheck.
	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	# Hashed bundles never change.
	location /_app/immutable/ {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Pages, the service worker, the manifest and version.json must be revalidated so updates arrive.
	location / {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ =404;
	}

	# nginx's mime.types doesn't know .webmanifest.
	location = /manifest.webmanifest {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-cache";
		types {}
		default_type application/manifest+json;
	}

	error_page 404 /404.html;
	location = /404.html {
		internal;
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-cache";
	}
}
