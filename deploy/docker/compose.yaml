# From the repository root:  docker compose -f deploy/docker/compose.yaml up -d --build
# Serves the site on 127.0.0.1:8003. Put an HTTPS reverse proxy or tunnel in front of it: Web Bluetooth
# only works on HTTPS (or on localhost).
name: opentoys
services:
  opentoys:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: opentoys:latest
    container_name: opentoys
    ports:
      - '127.0.0.1:8003:80' # Loopback only: reached through your HTTPS proxy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --tries=1 -O - http://127.0.0.1/healthz | grep -q ok']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
