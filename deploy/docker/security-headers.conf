# Included in every location: nginx drops server-level add_header lines in a location that has its own.
include /etc/nginx/snippets/csp.conf;
add_header Permissions-Policy "bluetooth=(self), screen-wake-lock=(self), accelerometer=(), camera=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), interest-cohort=(), browsing-topics=()" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# While in development: keep search engines out.
add_header X-Robots-Tag "noindex, nofollow" always;
